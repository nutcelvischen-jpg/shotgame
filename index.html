let ac=null;function audio(){if(!ac){try{ac=new AudioContext();}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();musicStart();}
function plop(){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(700,ac.currentTime);o.frequency.exponentialRampToValueAtTime(110,ac.currentTime+.16);g.gain.setValueAtTime(.35,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.22);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+.25);}

// ---------- music (procedural electro) ----------
const music={on:false,step:0,next:0,muted:false,master:null,noise:null};
const BASS=[0,0,12,0, 3,0,10,0, 0,0,12,0, 7,5,3,-2];

 music.master=ac.createGain();music.master.gain.value=music.muted?0:.2;music.master.connect(ac.destination);
 const b=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;music.noise=b;

function mood(){
 if(state==='wipe')return{bpm:126,int:.5};if(state!=='play')return{bpm:state==='doors'?124:100,int:state==='doors'?.45:.15};
 const left=stock/L.amount;const int=.3+.45*(1-left)+(power>.85?.25:0)+li*.05+(ev?.3:0);
 return{bpm:112+li*6+(left<.3?10:0)+(power>.85?6:0),int:Math.min(1,int)};}

const mb=document.createElement('button');mb.textContent='🔊';mb.style.cssText='position:fixed;left:12px;bottom:calc(16px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;border:none;background:rgba(0,0,0,.45);color:#fff;font-size:20px;z-index:5';

const FROZEN={water:1,rim:1,miss:1};
let waterCount=0;
function physics(){
 const lv=new THREE.Vector3(),tmp=new THREE.Vector3();
 for(const s of strands){
  const P=s.pts;
  for(const o of P){
   if(o.state==='pinned'){o.p.copy(emitter);o.q.copy(emitter);continue;}
   if(FROZEN[o.state]){if(o.local&&L.moving){o.p.copy(node.localToWorld(tmp.copy(o.local)));}continue;}
   const vx=(o.p.x-o.q.x)*.996,vy=(o.p.y-o.q.y)*.996,vz=(o.p.z-o.q.z)*.996;
   o.q.copy(o.p);o.p.x+=vx;o.p.y+=vy+G*L.fall*H*H;o.p.z+=vz;
  }
  for(let it=0;it<4;it++)for(let i=0;i<P.length-1;i++){
   const a=P[i],b=P[i+1];const wa=(a.state==='free'||a.state==='in')?1:0,wb=(b.state==='free'||b.state==='in')?1:0;if(wa+wb===0)continue;
   tmp.subVectors(b.p,a.p);const d=tmp.length()||1e-6;const k=(d-SEG)/d/(wa+wb);
   a.p.addScaledVector(tmp,k*wa);b.p.addScaledVector(tmp,-k*wb);
  }
  for(const o of P){
   if(o.state!=='free'&&o.state!=='in')continue;
   node.worldToLocal(lv.copy(o.p));
   if(o.state==='free'){
    if(o.prevL>hp.rimY&&lv.y<=hp.rimY){
     const dx=lv.x/hp.rx,dz=(lv.z-hp.cz)/hp.rz,e=dx*dx+dz*dz;
     const ex=lv.x/(hp.rx+hp.outer),ez=(lv.z-hp.cz)/(hp.rz+hp.outer),e2=ex*ex+ez*ez;
     if(e<1&&(!hp.half||lv.z<hp.cz)){o.state='in';o.restY=hp.waterY+.008+Math.random()*.015+Math.min(.07,waterCount*.00035);}
     else if(e2<1){o.state='rim';lv.y=hp.rimY+s.r*.5;o.local=lv.clone();o.p.copy(node.localToWorld(lv.clone()));if(Math.random()<.3)splat();continue;}
    }
    o.prevL=lv.y;
    if(ev&&ev.type==='dog'&&ev.phase!=='leave'&&o.p.y<.22&&Math.hypot(o.p.x-dogG.position.x,o.p.z-dogG.position.z)<.08){o.p.y=s.r*.5;o.state='miss';dogHit();continue;}
    const fy=floorAt(o.p.x,o.p.z);
    if(o.state==='free'&&o.p.y<=fy+s.r*.5){o.p.y=fy+s.r*.5;o.state='miss';if(!missSaid&&Math.random()<.5){missSaid=true;say('miss');}if(Math.random()<.35)splat();continue;}
   }
   if(o.state==='in'){
    const dx=lv.x/hp.rx,dz=(lv.z-hp.cz)/hp.rz,e=dx*dx+dz*dz;
    if(e>.6){const f=Math.sqrt(.6/e);lv.x*=f;lv.z=hp.cz+(lv.z-hp.cz)*f;}
    if(hp.half&&lv.z>hp.cz-.01)lv.z=hp.cz-.01;
    if(ev&&ev.type==='snake'&&ev.phase==='wait'&&Math.hypot(lv.x-ev.sx,lv.z-(ev.sz+.035))<.04&&lv.y<hp.waterY+ev.h){ev.phase='retreat';say('snake_hit',true);toast('命中蛇頭！蛇嚇跑了 🎯');$('#snakeT').classList.add('hidden');}
    if(lv.y<=o.restY){lv.y=o.restY;o.state='water';waterCount++;o.local=lv.clone();
     if(!s.splashed){s.splashed=true;splash(node.localToWorld(lv.clone()));plop();}}
    o.p.copy(node.localToWorld(lv.clone()));
   }
  }
 }
}
function buildTube(s){
 const P=s.pts;if(P.length<2){if(s.mesh)s.mesh.visible=false;return;}
 const arr=P.map(o=>o.p.clone());
 for(let i=1;i<arr.length;i++)if(arr[i].distanceToSquared(arr[i-1])<1e-9)arr[i].y-=2e-4;
 const curve=new THREE.CatmullRomCurve3(arr,false,'centripetal');
 const Ln=curve.getLength(),tub=Math.max(6,arr.length*3),rad=10;
 const g=new THREE.TubeGeometry(curve,tub,s.r,rad,false);
 const pos=g.attributes.position,c=new THREE.Vector3(),v=new THREE.Vector3();
 for(let i=0;i<=tub;i++){const u=i/tub;curve.getPointAt(u,c);const sl=u*Ln;
  let f=Math.sqrt(clamp(Math.min(sl,Ln-sl)/(s.r*1.3),0,1));
  f*=1+.12*Math.sin(sl*55+s.seed)+.06*Math.sin(sl*140+s.seed*2.3);
  for(let j=0;j<=rad;j++){const k=i*(rad+1)+j;v.fromBufferAttribute(pos,k).sub(c);v.multiplyScalar(f*(1+.05*Math.sin(j*2.1+sl*80+s.seed))).add(c);pos.setXYZ(k,v.x,v.y,v.z);}}
 g.computeVertexNormals();
 if(s.mesh){s.mesh.geometry.dispose();s.mesh.geometry=g;s.mesh.visible=true;}
 else{s.mesh=new THREE.Mesh(g,poopMat);s.mesh.castShadow=true;scene.add(s.mesh);}
}

function hideMsg(){$('#msg').classList.add('hidden');}
function menu(){clearEvents();state='menu';patience=100;
 showMsg(`<h1>💩 烙賽模擬器</h1><p>移動滑鼠（手機：拖曳畫面）控制屁股位置，<br>按住滑鼠／空白鍵／「用力」鈕出力。<br>📱 手機會用陀螺儀：傾斜手機就能移動桃子（每關開始時的角度會當作中心）。<br>力道在<b style="color:#7be39a">綠區</b>最穩，太大會噴射，太久不出力會憋不住。<br>越後面量越多、掉越快、晃越大。<br>小心有人推門（連按 E）、停電、阿飄借衛生紙、馬桶蛇、瘋狂吉娃娃！<br>烙完還要擦屁股：太用力會擦破喔。</p><button class="go" id="go">開始烙賽</button>`);
 $('#go').onclick=()=>{audio();enableGyro();enter(+(QS.get('lv')||0));};}
function enter(i){const lv=LEVELS[i];if(lv.doors)doorPick(i);else startLevel(i);}
function doorPick(i){state='doors';const n=LEVELS[i].doors,free=Math.floor(Math.random()*n);
 let h=`<h1>全滿了！</h1><p>${LEVELS[i].name}<br>每間都關著，猜哪一間有空？猜錯會扣忍耐值。</p><div id="doors">`;
 for(let k=0;k<n;k++)h+=`<div class="door" data-k="${k}">${k+1}</div>`;showMsg(h+'</div>');
 document.querySelectorAll('.door').forEach(d=>d.onclick=()=>{
  if(d.classList.contains('occ'))return;
  if(+d.dataset.k===free){startLevel(i);return;}
  d.classList.add('occ');d.textContent='有人啦！';patience-=30;splat();
  if(patience<=0){gameOver('來不及了……褲子陣亡。');}
 });}
function gameOver(s){clearEvents();state='over';showMsg(`<h1>${s}</h1><p>忍耐值歸零。</p><button class="go" id="go">重新開始</button>`);$('#go').onclick=menu;}
function endLevel(){
 state='result';let w=0,r=0,m=0;
 for(const s of strands)for(const o of s.pts){if(o.state==='water')w++;else if(o.state==='rim')r++;else if(o.state==='miss')m++;}
 const tot=w+r+m||1,pct=Math.round(w/tot*100),pass=pct>=60;if(pct>=90)say('perfect',true);
 startWipe({pct,pass,r,m,chunks});}
function showResult(hit,wp){state='result';const {pct,pass,r,m}=hit;
 const last=li===LEVELS.length-1;if(pass&&last)setTimeout(()=>say('champion',true),400);
 
 showMsg(`<h1>${pass&&last?'🏆 全破！<br>我很會大便！！讚 👍':pass?(pct>=90?'完美入洞！':'過關'):'噴得到處都是……'}</h1>
 <p>命中率 <b>${pct}%</b><br>${r?`坐墊中獎 ${r} 段　`:''}${m?`地板 ${m} 段`:''}${(!r&&!m)?'一滴不漏':''}</p><p style="margin-top:-6px">🧻 擦屁股評分 <b style="font-size:26px;color:#ffd36b">${wp.grade}</b>（${wp.sc} 分）<br>${wp.title}<br><span style="font-size:13px;opacity:.8">乾淨度 ${Math.round(wp.clean*100)}%・用了 ${wp.used} 張${wp.tears?`・擦破 ${wp.tears} 次`:''}</span></p>
 <button class="go" id="go">${pass?(last?'全破！再玩一次':'下一間'):'重來這間'}</button>`);
 $('#go').onclick=()=>{if(!pass)startLevel(li);else if(last)menu();else enter(li+1);};
}

// ---------- loop ----------
const down=new THREE.Vector3(0,-1,0);let phAcc=0;const clock=new THREE.Clock();
function hud(){
 $('#stockB').style.width=(stock/L.amount*100)+'%';$('#stockT').textContent=Math.round(stock/L.amount*100)+'%';
 let w=0,tot=0;for(const s of strands)for(const o of s.pts){if(FROZEN[o.state]){tot++;if(o.state==='water')w++;}}
 const pct=tot?Math.round(w/tot*100):100;$('#hitB').style.width=pct+'%';$('#hitT').textContent=tot?pct+'%':'—';
 $('#patB').style.width=patience+'%';$('#patT').textContent=patience;
 document.querySelector('#power .lvl').style.height=(power*100)+'%';
 document.querySelector('#power .lvl').style.background=power>.85?'#ff4d4d':power>.65?'#ffb347':power>.35?'#7bd389':'#c8873a';
}
function frame(){
 const dt=Math.min(clock.getDelta(),.05);t+=dt;voCool-=dt;if(state==='wipe')wipeTick(dt);
 if(state==='play'){
  const want=pushing||forced>0;if(forced>0)forced-=dt;
  power=want?Math.min(1,power+dt*(forced>0?1.6:.55)):Math.max(0,power-dt*1.8);
  if(!want&&stock>0)idle+=dt;else idle=0;
  if(idle>5){forced=1.3;idle=0;toast('憋不住了！！');say('forced',true);}
  if(gyro.on){target.x=clamp(gyro.g/26*.42,-.42,.42);target.z=clamp(.05+(gyro.b-gyro.b0)/26*.5,-.42,.75);}
  smooth.x+=(target.x-smooth.x)*Math.min(1,dt*6);smooth.z+=(target.z-smooth.z)*Math.min(1,dt*6);
  const sw=(L.sway+(ev&&ev.type==='dog'&&ev.phase==='run'?.05:0))*(1+power*1.5);
  emitter.set(smooth.x+sw*(Math.sin(t*1.7)+.6*Math.sin(t*3.3+1)),L.emitY,smooth.z+sw*(Math.sin(t*1.3+2)+.5*Math.sin(t*2.9)));
  const band=power>.85?3:power>.6?2:power>.25?1:0;if(band>powBand)say('push'+band,band===3);else if(band===0&&powBand>=2&&Math.random()<.4)say('huff');powBand=band;
  updateEvent(dt);if(state!=='play')return requestAnimationFrame(frame);
  if(L.moving)model.position.x=Math.sin(t*1.1)*.14+Math.sin(t*2.7)*.04;
  if(power>.12&&stock>0){if(!active)startStrand();acc+=(.15+power*.75)*L.rate*dt;
   while(acc>=SEG&&stock>0){acc-=SEG;stock-=SEG;emitParticle();if(active.len>=active.maxLen){breakStrand();startStrand();}}}
  else if(active)breakStrand();
  if(stock<=0){stock=0;if(active)breakStrand();endTimer+=dt;if(!relSaid){relSaid=true;say('relief',true);}
   const moving=strands.some(s=>s.pts.some(o=>!FROZEN[o.state]));if((!moving&&endTimer>.8)||endTimer>5)endLevel();}
  camera.position.y=1.55+Math.sin(t*1.2)*.004;
  if(shake>0){shake-=dt;camera.position.x=(Math.random()-.5)*shake*.06;}else camera.position.x=0;
  flashlight.position.copy(camera.position).add(new THREE.Vector3(.08,-.1,0));flashlight.target.position.set(emitter.x,0,emitter.z-.05);
 }
 phAcc+=dt;while(phAcc>=H){if(L&&node&&strands.length)physics();phAcc-=H;}
 for(const s of strands){if(L.moving||s.pts.some(o=>!FROZEN[o.state]))buildTube(s);}
 for(const d of drops){if(d.life>0){d.life-=dt;d.v.y+=G*dt;d.m.position.addScaledVector(d.v,dt);if(d.life<=0)d.m.visible=false;}}
 ring.visible=false;peach.visible=state==='play';
 if(peach.visible){const sq=power*.13,wob=power>.3?Math.sin(t*38)*power*.025:0;
  peach.position.set(emitter.x,emitter.y+.048*(1-sq*.5),emitter.z);
  peach.scale.set(1+sq+wob,1-sq,1+sq-wob);peach.rotation.y=Math.sin(t*.8)*.15;}
 marker.visible=false;
 if(state==='play'&&L.marker){ray.set(emitter,down);const objs=[model,stall];if(stepMesh)objs.push(stepMesh);
  const h=ray.intersectObjects(objs,true)[0];
  if(h){marker.visible=true;const n=h.face.normal.clone().transformDirection(h.object.matrixWorld);marker.position.copy(h.point).addScaledVector(n,.002);marker.lookAt(h.point.clone().add(n));}}
 if(toastT>0){toastT-=dt;if(toastT<=0)$('#toast').style.opacity=0;}
 if(state==='play')hud();
 renderer.render(scene,camera);requestAnimationFrame(frame);
}
camera.position.set(0,1.55,.28);camera.lookAt(0,.2,-.05);
menu();frame();window.__ok=true;
</script></body></html>
